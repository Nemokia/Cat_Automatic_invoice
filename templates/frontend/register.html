{% extends "base.html" %}
{% block title %}ثبتنام — Cat Invoice{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="logo">🐱</div>
        <h1>Cat Invoice</h1>
        <p class="subtitle">ساخت حساب جدید</p>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">نام کاربری</label>
                <input class="form-input" type="text" id="id_username" name="username" required
                       placeholder="نام کاربری" autocomplete="username" value="{{ username|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_first_name">نام</label>
                <input class="form-input" type="text" id="id_first_name" name="first_name"
                       placeholder="نام" value="{{ first_name|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_last_name">نام خانوادگی</label>
                <input class="form-input" type="text" id="id_last_name" name="last_name"
                       placeholder="نام خانوادگی" value="{{ last_name|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_phone">تلفن</label>
                <input class="form-input" type="tel" id="id_phone" name="phone" dir="ltr"
                       placeholder="09xxxxxxxxx" value="{{ phone|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_email">ایمیل <span style="color:var(--text-muted);font-size:12px;">(اختیاری — برای بازیابی رمز)</span></label>
                <input class="form-input" type="email" id="id_email" name="email" dir="ltr"
                       placeholder="email@example.com" value="{{ email|default:'' }}">
                <small style="color:var(--warning);font-size:11px;display:block;margin-top:4px;">
                    ⚠️ بدون ایمیل، امکان بازیابی رمز عبور وجود نخواهد داشت
                </small>
            </div>
            <div class="form-group">
                <label for="id_password">رمز عبور</label>
                <input class="form-input" type="password" id="id_password" name="password" required
                       placeholder="حداقل ۸ کاراکتر" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="id_password_confirm">تکرار رمز عبور</label>
                <input class="form-input" type="password" id="id_password_confirm" name="password_confirm" required
                       placeholder="تکرار رمز عبور" autocomplete="new-password">
            </div>
            {% if needs_captcha %}
            <div class="form-group captcha-group">
                <label>کد امنیتی (حاصل محاسبه را وارد کنید)</label>
                <div class="captcha-row">
                    <img src="{{ captcha_image_url }}" alt="captcha" class="captcha-img">
                    <button type="button" class="captcha-reload" onclick="reloadCaptcha(this)" title="بارگذاری مجدد کد">🔄</button>
                    <input class="form-input" type="text" name="captcha_1" required
                           placeholder="؟" dir="ltr" inputmode="numeric" autocomplete="off">
                    <input type="hidden" name="captcha_0" value="{{ captcha_key }}">
                </div>
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-block">ثبتنام</button>
        </form>
        <p style="margin-top:16px;font-size:14px;text-align:center;">
            <a href="{% url 'frontend:login' %}" style="color:var(--green);">ورود</a>
        </p>
    </div>
</div>
{% endblock %}
