{% extends "base.html" %}
{% block title %}ویرایش مشتری — Cat Invoice{% endblock %}
{% block content %}
<div class="page-header">
    <h1>ویرایش مشتری</h1>
    <a href="{% url 'frontend:customer_list' %}" class="btn btn-secondary">بازگشت</a>
</div>
<div class="card" style="max-width:600px;">
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label>نام</label>
            <input class="form-input" name="first_name" required value="{{ customer.first_name }}">
        </div>
        <div class="form-group">
            <label>نام خانوادگی</label>
            <input class="form-input" name="last_name" required value="{{ customer.last_name }}">
        </div>
        <div class="form-group">
            <label>تلفن</label>
            <input class="form-input" name="phone" maxlength="15" dir="ltr" style="text-align:left;" value="{{ customer.phone }}">
        </div>
        <div class="form-group">
            <label>آدرس</label>
            <textarea class="form-input" name="address" rows="2">{{ customer.address }}</textarea>
        </div>
        <div class="form-group">
            <label>شناسه ملی</label>
            <input class="form-input" name="national_id" maxlength="20" dir="ltr" style="text-align:left;" value="{{ customer.national_id }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
            <a href="{% url 'frontend:customer_list' %}" class="btn btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
