{% extends "base.html" %}
{% block title %}مشتری جدید — Cat Invoice{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if customer %}ویرایش مشتری{% else %}مشتری جدید{% endif %}</h1>
    <a href="{% url 'frontend:customer_list' %}" class="btn btn-secondary">بازگشت</a>
</div>
<div class="card" style="max-width:600px;">
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label>نام</label>
            <input class="form-input" name="first_name" required value="{{ first_name|default:'' }}">
        </div>
        <div class="form-group">
            <label>نام خانوادگی</label>
            <input class="form-input" name="last_name" required value="{{ last_name|default:'' }}">
        </div>
        <div class="form-group">
            <label>تلفن</label>
            <input class="form-input" name="phone" maxlength="15" dir="ltr" style="text-align:left;" value="{{ phone|default:'' }}">
        </div>
        <div class="form-group">
            <label>آدرس</label>
            <textarea class="form-input" name="address" rows="2">{{ address|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>شناسه ملی</label>
            <input class="form-input" name="national_id" maxlength="20" dir="ltr" style="text-align:left;" value="{{ national_id|default:'' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ذخیره</button>
            <a href="{% url 'frontend:customer_list' %}" class="btn btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
